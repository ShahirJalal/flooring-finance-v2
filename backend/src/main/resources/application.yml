server:
  port: 8080

spring:
  application:
    name: finance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flooring_finance}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only ever validates it matches.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Kuala_Lumpur
    date-format: yyyy-MM-dd

# Single-owner account + JWT settings. Never commit real secrets - these
# defaults are for local development only, see .env.example.
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-this-is-not-secure-enough-for-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    # Must be true in production (served over HTTPS via Cloudflare Tunnel).
    # Defaults to false so login works over plain http://localhost in local dev.
    cookie-secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.flooring.finance: INFO

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.flooring.finance: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
