<div class="app-shell">
  <header class="topbar">
    <a routerLink="/jobs" class="brand">
      <i class="pi pi-th-large"></i>
      <span>Flooring Finance</span>
    </a>
    <div class="topbar-actions">
      <button
        pButton type="button" [text]="true" severity="secondary" [rounded]="true"
        icon="pi pi-cog" routerLink="/settings"
        pTooltip="Settings" tooltipPosition="bottom"
      ></button>
      <button
        pButton type="button" [text]="true" severity="secondary" [rounded]="true"
        icon="pi pi-sign-out" (click)="logout()"
        pTooltip="Log out" tooltipPosition="bottom"
      ></button>
    </div>
  </header>

  <main class="content-area">
    <router-outlet />
  </main>
</div>
