<button
  type="button"
  class="theme-toggle-button"
  [pTooltip]="themeService.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  tooltipPosition="bottom"
  (click)="themeService.toggle()"
  aria-label="Toggle dark mode"
>
  <i [class]="themeService.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
</button>
